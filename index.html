<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>梳毛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #e8e4dd;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    touch-action: none;
  }

  #game {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
  }

  #catWrap {
    position: relative;
    width: min(85vw, 85vh, 520px);
    height: min(85vw, 85vh, 520px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #cat {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 10px 24px rgba(120,110,100,0.18));
    transition: opacity 0.15s ease;
  }

  #brush {
    position: absolute;
    pointer-events: none;
    z-index: 20;
    font-size: 64px;
    line-height: 1;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.18));
    display: none;
  }

  .fx {
    position: absolute;
    pointer-events: none;
    font-size: 30px;
    line-height: 1;
    z-index: 15;
    transform: translate(-50%, -50%);
    animation: floatUp 0.9s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -180%) scale(1.25); opacity: 0; }
  }

  #scorePanel {
    position: absolute;
    top: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
  }
  #scorePanel .label {
    font-size: 13px;
    letter-spacing: 2px;
    color: #8a8178;
    font-weight: 600;
  }
  #scorePanel .value {
    font-size: 44px;
    font-weight: 800;
    color: #6b6357;
    line-height: 1.1;
  }

  #multiplier {
    display: none;
    margin-top: 4px;
    font-size: 20px;
    font-weight: 800;
    color: #e07a7a;
    letter-spacing: 1px;
    animation: pulse 0.8s ease-in-out infinite;
  }
  #multiplier.show { display: block; }
  @keyframes pulse {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.15); opacity: 0.75; }
  }

  #deathModal {
    position: fixed;
    inset: 0;
    background: rgba(80, 72, 66, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.3s ease;
  }
  #deathModal.show { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #deathCard {
    background: #f4f1ec;
    border-radius: 24px;
    padding: 48px 64px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(60,52,46,0.25);
    animation: popIn 0.35s cubic-bezier(0.2, 1.2, 0.4, 1);
  }
  @keyframes popIn {
    0%   { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }
  #deathCard h1 {
    font-size: 42px;
    color: #a48b8b;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  #deathCard .sub {
    font-size: 15px;
    color: #8a8178;
    margin-bottom: 16px;
  }
  #deathCard .finalScore {
    font-size: 18px;
    font-weight: 700;
    color: #6b6357;
    margin-bottom: 28px;
  }
  #deathCard .finalScore #finalScore {
    font-size: 34px;
    color: #a48b8b;
    font-weight: 800;
    vertical-align: -3px;
    margin-left: 4px;
  }
  #restartBtn {
    padding: 12px 40px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: #a8b5a2;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
  }
  #restartBtn:hover  { background: #97a891; }
  #restartBtn:active { transform: scale(0.96); }

  /* ========== 开始界面 ========== */
  #startScreen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #e8e4dd;
    transition: opacity 0.5s ease;
  }
  #startScreen.hide {
    opacity: 0;
    pointer-events: none;
  }

  #startScreen .title {
    font-size: 52px;
    font-weight: 800;
    color: #6b6357;
    letter-spacing: 6px;
    margin-bottom: 12px;
    text-align: center;
  }
  #startScreen .subtitle {
    font-size: 15px;
    color: #8a8178;
    letter-spacing: 3px;
    margin-bottom: 56px;
  }

  #startBtn {
    padding: 16px 64px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    background: #a8b5a2;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 4px;
    box-shadow: 0 8px 24px rgba(168,181,162,0.5);
    transition: background 0.2s, transform 0.1s, opacity 0.3s;
  }
  #startBtn:hover:not(:disabled)  { background: #97a891; }
  #startBtn:active:not(:disabled) { transform: scale(0.96); }
  #startBtn:disabled {
    opacity: 0.5;
    cursor: default;
    box-shadow: none;
  }

  /* 加载进度 */
  #loadStatus {
    position: absolute;
    bottom: 56px;
    font-size: 13px;
    color: #8a8178;
    letter-spacing: 1px;
  }
  #loadStatus .num {
    font-weight: 800;
    color: #6b6357;
    font-size: 15px;
  }
</style>
</head>
<body>

<!-- ========== 开始界面 ========== -->
<div id="startScreen">
  <div class="title">梳猫毛</div>
  <div class="subtitle">红温时25倍率 ~ BRUSH or DIE</div>
  <button id="startBtn" disabled>加载中…</button>
  <div id="loadStatus">
    正在加载资源 <span class="num" id="loadCount">0</span> / <span id="loadTotal">0</span>
  </div>
</div>

<div id="game">
  <div id="scorePanel">
    <div class="label">梳毛次数</div>
    <div class="value" id="score">0</div>
    <div id="multiplier">×25</div>
  </div>

  <div id="catWrap">
    <img id="cat" src="https://raw.githubusercontent.com/12412175/gameMeow/main/images/cat.png" alt="猫" draggable="false">
  </div>

  <div id="brush">🫳</div>
</div>

<div id="deathModal">
  <div id="deathCard">
    <h1>You died！</h1>
    <div class="sub">猫咪生气了…</div>
    <div class="finalScore">梳毛次数<span id="finalScore">0</span></div>
    <button id="restartBtn">再来一次</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ====== 资源地址 ======
  const BASE_IMG  = 'https://raw.githubusercontent.com/12412175/gameMeow/main/images/';
  const BASE_SND  = 'https://raw.githubusercontent.com/12412175/gameMeow/main/sounds/';

  const IMG_NORMAL = BASE_IMG + 'cat.png';
  const IMG_ANGRY  = BASE_IMG + 'meow.png';

  // ====== 配置 ======
  const CONFIG = {
    minStrokeHeightRatio: 0.3,
    strokeIdleReset: 200,
    brushSoundCooldown: 80,

    calmStrokesMin: 3,
    calmStrokesMax: 30,
    angryStrokesMin: 2,
    angryStrokesMax: 50,

    forgiveMin: 1000,
    forgiveMax: 5000,

    bgmMin: 10000,
    bgmMax: 35000,
    bgmVolume: 0.35,

    angryMultiplier: 25
  };

  // ====== DOM ======
  const gameEl    = document.getElementById('game');
  const catEl     = document.getElementById('cat');
  const brushEl   = document.getElementById('brush');
  const scoreEl   = document.getElementById('score');
  const multiplierEl = document.getElementById('multiplier');
  const deathModal= document.getElementById('deathModal');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn= document.getElementById('restartBtn');

  const startScreen = document.getElementById('startScreen');
  const startBtn    = document.getElementById('startBtn');
  const loadCountEl = document.getElementById('loadCount');
  const loadTotalEl = document.getElementById('loadTotal');

  // ====== 音效 ======
  function makeAudio(src, volume) {
    const a = new Audio();
    a.preload = 'auto';
    a.src = src;
    a.volume = volume;
    return a;
  }

  const brushSounds = [
    makeAudio(BASE_SND + 'brush1.MP3', 0.45),
    makeAudio(BASE_SND + 'brush2.MP3', 0.45)
  ];
  const bgmSounds = [1,2,3,4,5,6].map(i =>
    makeAudio(BASE_SND + 'm' + i + '.MP3', CONFIG.bgmVolume)
  );
  const sounds = {
    meow: makeAudio(BASE_SND + 'meow.MP3', 0.6),
    lose: makeAudio(BASE_SND + 'lose.MP3', 0.7)
  };

  function playBrushSound() {
    const s = brushSounds[Math.floor(Math.random() * brushSounds.length)];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playBgmSound() {
    const s = bgmSounds[Math.floor(Math.random() * bgmSounds.length)];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playSound(name) {
    const s = sounds[name];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  // ========== 预加载 ==========
  // 收集所有需要预加载的资源
  const audioList = [
    ...brushSounds,
    ...bgmSounds,
    sounds.meow,
    sounds.lose
  ];
  const imageSrcList = [IMG_NORMAL, IMG_ANGRY];

  const totalTasks = audioList.length + imageSrcList.length;
  let doneTasks = 0;
  loadTotalEl.textContent = totalTasks;
  loadCountEl.textContent = '0';

  let allLoaded = false;

  function onTaskDone() {
    doneTasks++;
    loadCountEl.textContent = doneTasks;
    if (doneTasks >= totalTasks && !allLoaded) {
      allLoaded = true;
      startBtn.disabled = false;
      startBtn.textContent = '开始游戏';
    }
  }

  // 预加载图片
  function preloadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload  = () => { onTaskDone(); resolve(); };
      img.onerror = () => { onTaskDone(); resolve(); };  // 失败也算完成，不卡界面
      img.src = src;
    });
  }

  // 预加载音频（等 canplaythrough，或超时 8 秒放行）
  function preloadAudio(audio) {
    return new Promise(resolve => {
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        onTaskDone();
        resolve();
      };

      // 已经加载好
      if (audio.readyState >= 4) { finish(); return; }

      audio.addEventListener('canplaythrough', finish, { once: true });
      audio.addEventListener('error', finish, { once: true });
      audio.addEventListener('loadeddata', finish, { once: true });
      // 超时兜底，避免网络太差永远卡住
      setTimeout(finish, 8000);

      try { audio.load(); } catch (e) { finish(); }
    });
  }

  // 开始预加载
  const tasks = [
    ...imageSrcList.map(preloadImage),
    ...audioList.map(preloadAudio)
  ];

  Promise.all(tasks).then(() => {
    if (!allLoaded) {
      allLoaded = true;
      startBtn.disabled = false;
      startBtn.textContent = '开始游戏';
    }
  });

  // 点击开始 → 进入游戏
  startBtn.addEventListener('click', () => {
    // 首次用户手势：解锁音频
    // 用一次静音播放把音频"解锁"，iOS / 安卓都需要
    audioList.forEach(a => {
      try {
        a.muted = true;
        const p = a.play();
        if (p && p.then) {
          p.then(() => {
            a.pause();
            a.currentTime = 0;
            a.muted = false;
          }).catch(() => { a.muted = false; });
        } else {
          a.pause();
          a.currentTime = 0;
          a.muted = false;
        }
      } catch (e) {}
    });

    startScreen.classList.add('hide');
    setTimeout(() => { startScreen.style.display = 'none'; }, 500);

    // 启动游戏
    resetGame();
    scheduleBgm();
  });

  // ====== 背景音效调度 ======
  let bgmTimer = null;
  function scheduleBgm() {
    clearTimeout(bgmTimer);
    const delay = rand(CONFIG.bgmMin, CONFIG.bgmMax);
    bgmTimer = setTimeout(() => {
      if (state.catState === 'dead') return;
      playBgmSound();
      scheduleBgm();
    }, delay);
  }

  // ====== 有效区域 ======
  function getValidArea() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const half = w * 0.5;
    return {
      w, h,
      top:    h * 0.5 - half,
      bottom: h * 0.5 + half,
      minHeight: w * CONFIG.minStrokeHeightRatio
    };
  }

  function isInValidArea(clientY) {
    const a = getValidArea();
    return clientY >= a.top && clientY <= a.bottom;
  }

  // ====== 状态 ======
  const state = {
    score: 0,
    strokeStartY: null,
    strokeStartValid: false,
    strokeCounted: false,
    lastMoveTime: 0,
    lastBrushSoundTime: 0,

    catState: 'calm',
    strokesInCalm: 0,
    strokesInAngry: 0,
    calmTarget: 0,
    angryTarget: 0,

    forgiveTimer: null,
    lastStrokeTime: 0,
    brushShown: false
  };

  // ====== 工具 ======
  const rand = (a, b) => a + Math.random() * (b - a);
  const now  = () => performance.now();

  function spawnFx(x, y, char) {
    const el = document.createElement('div');
    el.className = 'fx';
    el.textContent = char;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    gameEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ====== 猫咪状态机 ======
  function setCatState(next) {
    state.catState = next;

    if (next === 'calm') {
      catEl.src = IMG_NORMAL;
      multiplierEl.classList.remove('show');
      state.strokesInCalm = 0;
      state.calmTarget = Math.round(rand(CONFIG.calmStrokesMin, CONFIG.calmStrokesMax));
    } else if (next === 'angry') {
      catEl.src = IMG_ANGRY;
      multiplierEl.classList.add('show');
      playSound('meow');
      state.strokesInAngry = 0;
      state.angryTarget = Math.round(rand(CONFIG.angryStrokesMin, CONFIG.angryStrokesMax));
      scheduleForgive();
    }
  }

  function scheduleForgive() {
    if (state.catState !== 'angry') return;
    clearTimeout(state.forgiveTimer);
    const delay = rand(CONFIG.forgiveMin, CONFIG.forgiveMax);
    state.forgiveTimer = setTimeout(() => {
      if (state.catState !== 'angry') return;
      if (now() - state.lastStrokeTime < delay) return;
      setCatState('calm');
    }, delay);
  }

  function die() {
    if (state.catState === 'dead') return;
    state.catState = 'dead';
    clearTimeout(state.forgiveTimer);
    multiplierEl.classList.remove('show');
    playSound('lose');
    finalScoreEl.textContent = state.score;
    deathModal.classList.add('show');
  }

  // ====== 滑动处理 ======
  function onPointerMove(clientX, clientY) {
    const rect = gameEl.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    const inArea = isInValidArea(clientY);
    if (inArea) {
      brushEl.style.display = 'block';
      brushEl.style.left = x + 'px';
      brushEl.style.top  = y + 'px';
      state.brushShown = true;
    } else {
      brushEl.style.display = 'none';
      state.strokeStartY = null;
      state.strokeStartValid = false;
      state.strokeCounted = false;
    }

    if (state.catState === 'dead') return;
    if (!inArea) return;

    const t = now();

    if (state.strokeStartY === null || t - state.lastMoveTime > CONFIG.strokeIdleReset) {
      state.strokeStartY = clientY;
      state.strokeStartValid = true;
      state.strokeCounted = false;
      state.lastMoveTime = t;
      return;
    }

    const dy = clientY - state.strokeStartY;
    const minH = getValidArea().minHeight;

    if (dy > 0 && dy >= minH && !state.strokeCounted) {
      state.strokeCounted = true;

      const gain = state.catState === 'angry' ? CONFIG.angryMultiplier : 1;
      state.score += gain;
      scoreEl.textContent = state.score;

      if (t - state.lastBrushSoundTime > CONFIG.brushSoundCooldown) {
        playBrushSound();
        state.lastBrushSoundTime = t;
      }

      const fxChar = state.catState === 'angry' ? '💢' : '💗';
      spawnFx(x, y, fxChar);

      state.lastStrokeTime = t;

      if (state.catState === 'calm') {
        state.strokesInCalm++;
        if (state.strokesInCalm >= state.calmTarget) {
          setCatState('angry');
        }
      } else if (state.catState === 'angry') {
        state.strokesInAngry++;
        scheduleForgive();
        if (state.strokesInAngry >= state.angryTarget) {
          die();
        }
      }
    }

    state.lastMoveTime = t;
  }

  function onPointerLeave() {
    state.strokeStartY = null;
    state.strokeStartValid = false;
    state.strokeCounted = false;
    brushEl.style.display = 'none';
  }

  // ====== 事件绑定 ======
  gameEl.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
  gameEl.addEventListener('mouseleave', onPointerLeave);

  gameEl.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    state.strokeStartY = null;
    state.strokeCounted = false;
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  gameEl.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  gameEl.addEventListener('touchend', onPointerLeave);
  gameEl.addEventListener('touchcancel', onPointerLeave);

  restartBtn.addEventListener('click', () => {
    deathModal.classList.remove('show');
    resetGame();
  });

  // ====== 重置 ======
  function resetGame() {
    state.score = 0;
    scoreEl.textContent = '0';
    state.strokeStartY = null;
    state.strokeStartValid = false;
    state.strokeCounted = false;
    state.lastMoveTime = 0;
    state.lastBrushSoundTime = 0;
    state.lastStrokeTime = 0;
    state.brushShown = false;
    brushEl.style.display = 'none';
    clearTimeout(state.forgiveTimer);
    multiplierEl.classList.remove('show');
    setCatState('calm');
  }

  // ====== 启动 ======
  // 注意：游戏逻辑等点击"开始游戏"后才启动
  // 这里先只做资源预加载
})();
</script>
</body>
</html>
