<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>梳毛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #e8e4dd;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    touch-action: none;
  }

  #game {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
  }

  #catWrap {
    position: relative;
    width: min(85vw, 85vh, 520px);
    height: min(85vw, 85vh, 520px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #cat {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 10px 24px rgba(120,110,100,0.18));
    transition: opacity 0.15s ease;
  }

  #brush {
    position: absolute;
    pointer-events: none;
    z-index: 20;
    font-size: 64px;
    line-height: 1;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.18));
    display: none;
  }

  .fx {
    position: absolute;
    pointer-events: none;
    font-size: 30px;
    line-height: 1;
    z-index: 15;
    transform: translate(-50%, -50%);
    animation: floatUp 0.9s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -180%) scale(1.25); opacity: 0; }
  }

  /* 左上角分数 */
  #scorePanel {
    position: absolute;
    top: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
  }
  #scorePanel .label {
    font-size: 13px;
    letter-spacing: 2px;
    color: #8a8178;
    font-weight: 600;
  }
  #scorePanel .value {
    font-size: 44px;
    font-weight: 800;
    color: #6b6357;
    line-height: 1.1;
  }

  /* ×5 提示 */
  #multiplier {
    display: none;
    margin-top: 4px;
    font-size: 20px;
    font-weight: 800;
    color: #e07a7a;
    letter-spacing: 1px;
    animation: pulse 0.8s ease-in-out infinite;
  }
  #multiplier.show { display: block; }
  @keyframes pulse {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.15); opacity: 0.75; }
  }

  #deathModal {
    position: fixed;
    inset: 0;
    background: rgba(80, 72, 66, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.3s ease;
  }
  #deathModal.show { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #deathCard {
    background: #f4f1ec;
    border-radius: 24px;
    padding: 48px 64px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(60,52,46,0.25);
    animation: popIn 0.35s cubic-bezier(0.2, 1.2, 0.4, 1);
  }
  @keyframes popIn {
    0%   { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }
  #deathCard h1 {
    font-size: 42px;
    color: #a48b8b;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  #deathCard .sub {
    font-size: 15px;
    color: #8a8178;
    margin-bottom: 16px;
  }
  /* 弹窗里的最终分数 */
  #deathCard .finalScore {
    font-size: 18px;
    font-weight: 700;
    color: #6b6357;
    margin-bottom: 28px;
  }
  #deathCard .finalScore #finalScore {
    font-size: 34px;
    color: #a48b8b;
    font-weight: 800;
    vertical-align: -3px;
    margin-left: 4px;
  }
  #restartBtn {
    padding: 12px 40px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: #a8b5a2;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
  }
  #restartBtn:hover  { background: #97a891; }
  #restartBtn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="game">
  <div id="scorePanel">
    <div class="label">梳毛次数</div>
    <div class="value" id="score">0</div>
    <div id="multiplier">×25</div>
  </div>

  <div id="catWrap">
    <img id="cat" src="https://raw.githubusercontent.com/12412175/gameMeow/main/images/cat.png" alt="猫" draggable="false">
  </div>

  <div id="brush">🫳</div>
</div>

<div id="deathModal">
  <div id="deathCard">
    <h1>You died！</h1>
    <div class="sub">猫咪生气了…</div>
    <div class="finalScore">梳毛次数<span id="finalScore">0</span></div>
    <button id="restartBtn">再来一次</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ====== 资源地址 ======
  const BASE_IMG  = 'https://raw.githubusercontent.com/12412175/gameMeow/main/images/';
  const BASE_SND  = 'https://raw.githubusercontent.com/12412175/gameMeow/main/sounds/';

  const IMG_NORMAL = BASE_IMG + 'cat.png';
  const IMG_ANGRY  = BASE_IMG + 'meow.png';

  // ====== 配置 ======
  const CONFIG = {
    // 划动判定
    minStrokeHeightRatio: 0.3,
    strokeIdleReset: 200,

    brushSoundCooldown: 80,

    // 猫咪状态（由划动次数驱动）
    calmStrokesMin: 3,
    calmStrokesMax: 30,
    angryStrokesMin: 2,
    angryStrokesMax: 50,

    // 回头时停止梳毛多久后恢复
    forgiveMin: 1000,
    forgiveMax: 5000,

    // 背景音效
    bgmMin: 10000,
    bgmMax: 35000,
    bgmVolume: 0.35,

    // 回头时的得分倍率
    angryMultiplier: 25
  };

  // ====== DOM ======
  const gameEl    = document.getElementById('game');
  const catEl     = document.getElementById('cat');
  const brushEl   = document.getElementById('brush');
  const scoreEl   = document.getElementById('score');
  const multiplierEl = document.getElementById('multiplier');
  const deathModal= document.getElementById('deathModal');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn= document.getElementById('restartBtn');

  // ====== 音效 ======
 function makeAudio(src, volume) {
  const a = new Audio();
  a.preload = 'auto';        // 让浏览器主动预加载
  a.src = src;
  a.volume = volume;
  a.load();                  // 主动触发加载
  return a;
}
 
  const brushSounds = [
  makeAudio(BASE_SND + 'brush1.MP3', 0.45),
  makeAudio(BASE_SND + 'brush2.MP3', 0.45)
];
  const bgmSounds = [1,2,3,4,5,6].map(i =>
  makeAudio(BASE_SND + 'm' + i + '.MP3', CONFIG.bgmVolume)
);
  const sounds = {
  meow: makeAudio(BASE_SND + 'meow.MP3', 0.6),
  lose: makeAudio(BASE_SND + 'lose.MP3', 0.7)
};

  function playBrushSound() {
    const s = brushSounds[Math.floor(Math.random() * brushSounds.length)];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playBgmSound() {
    const s = bgmSounds[Math.floor(Math.random() * bgmSounds.length)];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playSound(name) {
    const s = sounds[name];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  // ====== 背景音效调度 ======
  let bgmTimer = null;
  function scheduleBgm() {
    clearTimeout(bgmTimer);
    const delay = rand(CONFIG.bgmMin, CONFIG.bgmMax);
    bgmTimer = setTimeout(() => {
      if (state.catState === 'dead') return;
      playBgmSound();
      scheduleBgm();
    }, delay);
  }

  // ====== 有效区域 ======
  function getValidArea() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const half = w * 0.5;
    return {
      w, h,
      top:    h * 0.5 - half,
      bottom: h * 0.5 + half,
      minHeight: w * CONFIG.minStrokeHeightRatio
    };
  }

  function isInValidArea(clientY) {
    const a = getValidArea();
    return clientY >= a.top && clientY <= a.bottom;
  }

  // ====== 状态 ======
  const state = {
    score: 0,

    strokeStartY: null,
    strokeStartValid: false,
    strokeCounted: false,
    lastMoveTime: 0,
    lastBrushSoundTime: 0,

    catState: 'calm',
    strokesInCalm: 0,
    strokesInAngry: 0,
    calmTarget: 0,
    angryTarget: 0,

    forgiveTimer: null,
    lastStrokeTime: 0,

    brushShown: false
  };

  // ====== 工具 ======
  const rand = (a, b) => a + Math.random() * (b - a);
  const now  = () => performance.now();

  function spawnFx(x, y, char) {
    const el = document.createElement('div');
    el.className = 'fx';
    el.textContent = char;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    gameEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ====== 猫咪状态机 ======
  function setCatState(next) {
    state.catState = next;

    if (next === 'calm') {
      catEl.src = IMG_NORMAL;
      multiplierEl.classList.remove('show');       // 隐藏 ×5
      state.strokesInCalm = 0;
      state.calmTarget = Math.round(rand(CONFIG.calmStrokesMin, CONFIG.calmStrokesMax));
    } else if (next === 'angry') {
      catEl.src = IMG_ANGRY;
      multiplierEl.classList.add('show');           // 显示 ×5
      playSound('meow');
      state.strokesInAngry = 0;
      state.angryTarget = Math.round(rand(CONFIG.angryStrokesMin, CONFIG.angryStrokesMax));
      scheduleForgive();
    }
  }

  function scheduleForgive() {
    if (state.catState !== 'angry') return;
    clearTimeout(state.forgiveTimer);
    const delay = rand(CONFIG.forgiveMin, CONFIG.forgiveMax);
    state.forgiveTimer = setTimeout(() => {
      if (state.catState !== 'angry') return;
      if (now() - state.lastStrokeTime < delay) return;
      setCatState('calm');
    }, delay);
  }

  function die() {
    if (state.catState === 'dead') return;
    state.catState = 'dead';
    clearTimeout(state.forgiveTimer);
    multiplierEl.classList.remove('show');
    playSound('lose');

    // 显示最终梳毛次数
    finalScoreEl.textContent = state.score;

    deathModal.classList.add('show');
  }

  // ====== 滑动处理 ======
  function onPointerMove(clientX, clientY) {
    const rect = gameEl.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    const inArea = isInValidArea(clientY);
    if (inArea) {
      brushEl.style.display = 'block';
      brushEl.style.left = x + 'px';
      brushEl.style.top  = y + 'px';
      state.brushShown = true;
    } else {
      brushEl.style.display = 'none';
      state.strokeStartY = null;
      state.strokeStartValid = false;
      state.strokeCounted = false;
    }

    if (state.catState === 'dead') return;
    if (!inArea) return;

    const t = now();

    if (state.strokeStartY === null || t - state.lastMoveTime > CONFIG.strokeIdleReset) {
      state.strokeStartY = clientY;
      state.strokeStartValid = true;
      state.strokeCounted = false;
      state.lastMoveTime = t;
      return;
    }

    const dy = clientY - state.strokeStartY;
    const minH = getValidArea().minHeight;

    if (dy > 0 && dy >= minH && !state.strokeCounted) {
      state.strokeCounted = true;

      // ====== 计分：回头时 5 倍 ======
      const gain = state.catState === 'angry' ? CONFIG.angryMultiplier : 1;
      state.score += gain;
      scoreEl.textContent = state.score;

      if (t - state.lastBrushSoundTime > CONFIG.brushSoundCooldown) {
        playBrushSound();
        state.lastBrushSoundTime = t;
      }

      const fxChar = state.catState === 'angry' ? '💢' : '💗';
      spawnFx(x, y, fxChar);

      state.lastStrokeTime = t;

      // ---- 推进猫咪状态（按次数，不受倍率影响）----
      if (state.catState === 'calm') {
        state.strokesInCalm++;
        if (state.strokesInCalm >= state.calmTarget) {
          setCatState('angry');
        }
      } else if (state.catState === 'angry') {
        state.strokesInAngry++;
        scheduleForgive();
        if (state.strokesInAngry >= state.angryTarget) {
          die();
        }
      }
    }

    state.lastMoveTime = t;
  }

  function onPointerLeave() {
    state.strokeStartY = null;
    state.strokeStartValid = false;
    state.strokeCounted = false;
    brushEl.style.display = 'none';
  }

  // ====== 事件绑定 ======
  gameEl.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
  gameEl.addEventListener('mouseleave', onPointerLeave);

  gameEl.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    state.strokeStartY = null;
    state.strokeCounted = false;
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  gameEl.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  gameEl.addEventListener('touchend', onPointerLeave);
  gameEl.addEventListener('touchcancel', onPointerLeave);

  restartBtn.addEventListener('click', () => {
    deathModal.classList.remove('show');
    resetGame();
  });

  // ====== 重置 ======
  function resetGame() {
    state.score = 0;
    scoreEl.textContent = '0';
    state.strokeStartY = null;
    state.strokeStartValid = false;
    state.strokeCounted = false;
    state.lastMoveTime = 0;
    state.lastBrushSoundTime = 0;
    state.lastStrokeTime = 0;
    state.brushShown = false;
    brushEl.style.display = 'none';
    clearTimeout(state.forgiveTimer);
    multiplierEl.classList.remove('show');
    setCatState('calm');
  }

  // ====== 启动 ======
  setCatState('calm');
  scheduleBgm();
})();
</script>
</body>
</html>
