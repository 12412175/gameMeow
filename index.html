<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>梳毛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #e8e4dd;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    touch-action: none;
  }

  #game {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
  }

  #catWrap {
    position: relative;
    width: min(85vw, 85vh, 520px);
    height: min(85vw, 85vh, 520px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #cat {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 10px 24px rgba(120,110,100,0.18));
    transition: opacity 0.15s ease;
  }

  #brush {
    position: absolute;
    pointer-events: none;
    z-index: 20;
    font-size: 64px;
    line-height: 1;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.18));
    display: none;
  }

  .fx {
    position: absolute;
    pointer-events: none;
    font-size: 30px;
    line-height: 1;
    z-index: 15;
    transform: translate(-50%, -50%);
    animation: floatUp 0.9s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -180%) scale(1.25); opacity: 0; }
  }

  #scorePanel {
    position: absolute;
    top: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
  }
  #scorePanel .label {
    font-size: 13px;
    letter-spacing: 2px;
    color: #8a8178;
    font-weight: 600;
  }
  #scorePanel .value {
    font-size: 44px;
    font-weight: 800;
    color: #6b6357;
    line-height: 1.1;
  }

  #deathModal {
    position: fixed;
    inset: 0;
    background: rgba(80, 72, 66, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.3s ease;
  }
  #deathModal.show { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #deathCard {
    background: #f4f1ec;
    border-radius: 24px;
    padding: 48px 64px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(60,52,46,0.25);
    animation: popIn 0.35s cubic-bezier(0.2, 1.2, 0.4, 1);
  }
  @keyframes popIn {
    0%   { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }
  #deathCard h1 {
    font-size: 42px;
    color: #a48b8b;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  #deathCard .sub {
    font-size: 15px;
    color: #8a8178;
    margin-bottom: 28px;
  }
  #restartBtn {
    padding: 12px 40px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: #a8b5a2;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
  }
  #restartBtn:hover  { background: #97a891; }
  #restartBtn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="game">
  <div id="scorePanel">
    <div class="label">梳毛次数</div>
    <div class="value" id="score">0</div>
  </div>

  <div id="catWrap">
    <img id="cat" src="https://raw.githubusercontent.com/12412175/gameMeow/main/images/cat.png" alt="猫" draggable="false">
  </div>

  <div id="brush">🫳</div>
</div>

<div id="deathModal">
  <div id="deathCard">
    <h1>you died！</h1>
    <div class="sub">猫咪生气了…</div>
    <button id="restartBtn">再来一次</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ====== 资源地址 ======
  const BASE_IMG  = 'https://raw.githubusercontent.com/12412175/gameMeow/main/images/';
  const BASE_SND  = 'https://raw.githubusercontent.com/12412175/gameMeow/main/sounds/';

  const IMG_NORMAL = BASE_IMG + 'cat.png';
  const IMG_ANGRY  = BASE_IMG + 'meow.png';

  // ====== 配置 ======
  const CONFIG = {
    // 划动判定
    minStrokeHeightRatio: 0.3,   // 一次有效划动的高度 > 0.3 * 屏幕宽度
    strokeIdleReset: 200,        // 超过这个时间没移动就重置划动起点（ms）

    brushSoundCooldown: 180,     // brush 音效最短间隔（ms）

    // 猫咪状态（由划动次数驱动）
    calmStrokesMin: 3,
    calmStrokesMax: 12,
    angryStrokesMin: 2,
    angryStrokesMax: 8,

    // 回头时停止梳毛多久后恢复
    forgiveMin: 1000,
    forgiveMax: 5000,

    // 背景音效
    bgmMin: 3000,
    bgmMax: 12000,
    bgmVolume: 0.35
  };

  // ====== DOM ======
  const gameEl    = document.getElementById('game');
  const catEl     = document.getElementById('cat');
  const brushEl   = document.getElementById('brush');
  const scoreEl   = document.getElementById('score');
  const deathModal= document.getElementById('deathModal');
  const restartBtn= document.getElementById('restartBtn');

  // ====== 音效（后缀统一改成 .MP3） ======
  const brushSounds = [
    new Audio(BASE_SND + 'brush1.MP3'),
    new Audio(BASE_SND + 'brush2.MP3')
  ];
  brushSounds.forEach(s => { s.volume = 0.45; });

  const bgmSounds = [1,2,3,4,5,6].map(i =>
    new Audio(BASE_SND + 'm' + i + '.MP3')
  );
  bgmSounds.forEach(s => { s.volume = CONFIG.bgmVolume; });

  const sounds = {
    meow: new Audio(BASE_SND + 'meow.MP3'),
    lose: new Audio(BASE_SND + 'lose.MP3')
  };
  sounds.meow.volume = 0.6;
  sounds.lose.volume = 0.7;

  function playBrushSound() {
    const s = brushSounds[Math.floor(Math.random() * brushSounds.length)];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playBgmSound() {
    const s = bgmSounds[Math.floor(Math.random() * bgmSounds.length)];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playSound(name) {
    const s = sounds[name];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  // ====== 背景音效调度 ======
  let bgmTimer = null;
  function scheduleBgm() {
    clearTimeout(bgmTimer);
    const delay = rand(CONFIG.bgmMin, CONFIG.bgmMax);
    bgmTimer = setTimeout(() => {
      if (state.catState === 'dead') return;
      playBgmSound();
      scheduleBgm();
    }, delay);
  }

  // ====== 有效区域计算（核心） ======
  // 屏幕宽 x、高 h
  // 竖直有效范围：[0.5h - 0.5x, 0.5h + 0.5x]
  // 水平不做限制（你想限制可以再加）
  function getValidArea() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const half = w * 0.5;
    return {
      w, h,
      top:    h * 0.5 - half,   // 上边界
      bottom: h * 0.5 + half,   // 下边界
      minHeight: w * CONFIG.minStrokeHeightRatio   // 一次划动需要的最小高度
    };
  }

  function isInValidArea(clientY) {
    const a = getValidArea();
    return clientY >= a.top && clientY <= a.bottom;
  }

  // ====== 状态 ======
  const state = {
    score: 0,

    // 一次划动的追踪
    strokeStartY: null,          // 本次划动起点（clientY）
    strokeStartValid: false,     // 起点是否在有效区域内
    strokeCounted: false,        // 本次划动是否已经计过分（保证一次最多计一次）
    lastMoveTime: 0,
    lastBrushSoundTime: 0,

    catState: 'calm',
    strokesInCalm: 0,
    strokesInAngry: 0,
    calmTarget: 0,
    angryTarget: 0,

    forgiveTimer: null,
    lastStrokeTime: 0,

    brushShown: false
  };

  // ====== 工具 ======
  const rand = (a, b) => a + Math.random() * (b - a);
  const now  = () => performance.now();

  function spawnFx(x, y, char) {
    const el = document.createElement('div');
    el.className = 'fx';
    el.textContent = char;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    gameEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ====== 猫咪状态机 ======
  function setCatState(next) {
    state.catState = next;

    if (next === 'calm') {
      catEl.src = IMG_NORMAL;
      state.strokesInCalm = 0;
      state.calmTarget = Math.round(rand(CONFIG.calmStrokesMin, CONFIG.calmStrokesMax));
    } else if (next === 'angry') {
      catEl.src = IMG_ANGRY;
      playSound('meow');
      state.strokesInAngry = 0;
      state.angryTarget = Math.round(rand(CONFIG.angryStrokesMin, CONFIG.angryStrokesMax));
      scheduleForgive();
    }
  }

  function scheduleForgive() {
    if (state.catState !== 'angry') return;
    clearTimeout(state.forgiveTimer);
    const delay = rand(CONFIG.forgiveMin, CONFIG.forgiveMax);
    state.forgiveTimer = setTimeout(() => {
      if (state.catState !== 'angry') return;
      if (now() - state.lastStrokeTime < delay) return;
      setCatState('calm');
    }, delay);
  }

  function die() {
    if (state.catState === 'dead') return;
    state.catState = 'dead';
    clearTimeout(state.forgiveTimer);
    playSound('lose');
    deathModal.classList.add('show');
  }

  // ====== 滑动处理 ======
  function onPointerMove(clientX, clientY) {
    const rect = gameEl.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    // ---- 有效区域判断：不在范围内就不显示梳子 ----
    const inArea = isInValidArea(clientY);
    if (inArea) {
      brushEl.style.display = 'block';
      brushEl.style.left = x + 'px';
      brushEl.style.top  = y + 'px';
      state.brushShown = true;
    } else {
      brushEl.style.display = 'none';
      // 离开有效区域，视为一次划动结束
      state.strokeStartY = null;
      state.strokeStartValid = false;
      state.strokeCounted = false;
    }

    if (state.catState === 'dead') return;
    if (!inArea) return;

    const t = now();

    // ---- 开始一次新划动 ----
    if (state.strokeStartY === null || t - state.lastMoveTime > CONFIG.strokeIdleReset) {
      state.strokeStartY = clientY;
      state.strokeStartValid = true;
      state.strokeCounted = false;
      state.lastMoveTime = t;
      return;
    }

    // ---- 计算本次划动已经走过的竖直高度 ----
    const dy = clientY - state.strokeStartY;   // 正数 = 从上往下

    // ---- 判定 ----
    // 条件1：从上往下（dy > 0）
    // 条件2：本次划动竖直高度超过阈值
    // 条件3：本次划动还没计过分
    const minH = getValidArea().minHeight;

    if (dy > 0 && dy >= minH && !state.strokeCounted) {
      state.strokeCounted = true;          // 锁定，本次划动不再计分

      // ====== 一次有效梳毛 ======
      state.score++;
      scoreEl.textContent = state.score;

      if (t - state.lastBrushSoundTime > CONFIG.brushSoundCooldown) {
        playBrushSound();
        state.lastBrushSoundTime = t;
      }

      const fxChar = state.catState === 'angry' ? '💢' : '💗';
      spawnFx(x, y, fxChar);

      state.lastStrokeTime = t;

      // ---- 推进猫咪状态 ----
      if (state.catState === 'calm') {
        state.strokesInCalm++;
        if (state.strokesInCalm >= state.calmTarget) {
          setCatState('angry');
        }
      } else if (state.catState === 'angry') {
        state.strokesInAngry++;
        scheduleForgive();
        if (state.strokesInAngry >= state.angryTarget) {
          die();
        }
      }
    }

    state.lastMoveTime = t;
  }

  // 手指/鼠标离开 → 结束本次划动
  function onPointerLeave() {
    state.strokeStartY = null;
    state.strokeStartValid = false;
    state.strokeCounted = false;
    brushEl.style.display = 'none';
  }

  // ====== 事件绑定 ======
  gameEl.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
  gameEl.addEventListener('mouseleave', onPointerLeave);

  gameEl.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    state.strokeStartY = null;
    state.strokeCounted = false;
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  gameEl.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  gameEl.addEventListener('touchend', onPointerLeave);
  gameEl.addEventListener('touchcancel', onPointerLeave);

  restartBtn.addEventListener('click', () => {
    deathModal.classList.remove('show');
    resetGame();
  });

  // ====== 重置 ======
  function resetGame() {
    state.score = 0;
    scoreEl.textContent = '0';
    state.strokeStartY = null;
    state.strokeStartValid = false;
    state.strokeCounted = false;
    state.lastMoveTime = 0;
    state.lastBrushSoundTime = 0;
    state.lastStrokeTime = 0;
    state.brushShown = false;
    brushEl.style.display = 'none';
    clearTimeout(state.forgiveTimer);
    setCatState('calm');
  }

  // ====== 启动 ======
  setCatState('calm');
  scheduleBgm();
})();
</script>
</body>
</html>
