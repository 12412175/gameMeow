<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>梳毛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #e8e4dd;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    touch-action: none;
  }

  #game {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
  }

  #catWrap {
    position: relative;
    width: min(85vw, 85vh, 520px);
    height: min(85vw, 85vh, 520px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #cat {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 10px 24px rgba(120,110,100,0.18));
    transition: opacity 0.15s ease;
  }

  #brush {
    position: absolute;
    pointer-events: none;
    z-index: 20;
    font-size: 64px;
    line-height: 1;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.18));
    display: none;
  }

  .fx {
    position: absolute;
    pointer-events: none;
    font-size: 30px;
    line-height: 1;
    z-index: 15;
    transform: translate(-50%, -50%);
    animation: floatUp 0.9s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -180%) scale(1.25); opacity: 0; }
  }

  #scorePanel {
    position: absolute;
    top: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
  }
  #scorePanel .label {
    font-size: 13px;
    letter-spacing: 2px;
    color: #8a8178;
    font-weight: 600;
  }
  #scorePanel .value {
    font-size: 44px;
    font-weight: 800;
    color: #6b6357;
    line-height: 1.1;
  }

  #deathModal {
    position: fixed;
    inset: 0;
    background: rgba(80, 72, 66, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.3s ease;
  }
  #deathModal.show { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #deathCard {
    background: #f4f1ec;
    border-radius: 24px;
    padding: 48px 64px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(60,52,46,0.25);
    animation: popIn 0.35s cubic-bezier(0.2, 1.2, 0.4, 1);
  }
  @keyframes popIn {
    0%   { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }
  #deathCard h1 {
    font-size: 42px;
    color: #a48b8b;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  #deathCard .sub {
    font-size: 15px;
    color: #8a8178;
    margin-bottom: 28px;
  }
  #restartBtn {
    padding: 12px 40px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: #a8b5a2;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
  }
  #restartBtn:hover  { background: #97a891; }
  #restartBtn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="game">
  <div id="scorePanel">
    <div class="label">梳毛次数</div>
    <div class="value" id="score">0</div>
  </div>

  <div id="catWrap">
    <img id="cat" src="https://raw.githubusercontent.com/12412175/gameMeow/main/images/cat.png" alt="猫" draggable="false" crossorigin="anonymous">
  </div>

  <div id="brush">🫳</div>
</div>

<div id="deathModal">
  <div id="deathCard">
    <h1>you died！</h1>
    <div class="sub">猫咪生气了…</div>
    <button id="restartBtn">再来一次</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ====== 资源地址 ======
  const BASE_IMG  = 'https://raw.githubusercontent.com/12412175/gameMeow/main/images/';
  const BASE_SND  = 'https://raw.githubusercontent.com/12412175/gameMeow/main/sounds/';

  const IMG_NORMAL = BASE_IMG + 'cat.png';
  const IMG_ANGRY  = BASE_IMG + 'meow.png';

  // ====== 配置 ======
  const CONFIG = {
    minStrokeLength: 100,      // 一次有效梳毛的最小滑动距离（像素）
    brushSoundCooldown: 180,   // brush 音效最短间隔（毫秒）

    // ====== 核心：所有"回头/死亡"由划动次数驱动 ======
    // 平静期：累计这么多次有效划动后，猫回头
    calmStrokesMin: 3,         // 最少划几下回头
    calmStrokesMax: 12,        // 最多划几下回头
    // 生气期：回头后再累计这么多次有效划动，猫死亡
    angryStrokesMin: 2,        // 最少再划几下死亡
    angryStrokesMax: 8,        // 最多再划几下死亡

    // 回头时停止梳毛多久后恢复（ms）
    forgiveMin: 1000,
    forgiveMax: 5000,

    strokeIdleReset: 150,      // 超过这个时间没移动就重置滑动起点

    // 背景音效随机播放间隔（ms）
    bgmMin: 3000,
    bgmMax: 12000,
    bgmVolume: 0.35
  };

  // ====== DOM ======
  const gameEl    = document.getElementById('game');
  const catEl     = document.getElementById('cat');
  const brushEl   = document.getElementById('brush');
  const scoreEl   = document.getElementById('score');
  const deathModal= document.getElementById('deathModal');
  const restartBtn= document.getElementById('restartBtn');

  // ====== 音效 ======
  // brush 音效：随机二选一
  const brushSounds = [
    new Audio(BASE_SND + 'brush1.mp3'),
    new Audio(BASE_SND + 'brush2.mp3')
  ];
  brushSounds.forEach(s => { s.volume = 0.45; });

  // 背景音效：m1 ~ m6
  const bgmSounds = [1,2,3,4,5,6].map(i =>
    new Audio(BASE_SND + 'm' + i + '.mp3')
  );
  bgmSounds.forEach(s => { s.volume = CONFIG.bgmVolume; });

  // 其他音效
  const sounds = {
    meow: new Audio(BASE_SND + 'meow.mp3'),
    lose: new Audio(BASE_SND + 'lose.mp3')
  };
  sounds.meow.volume = 0.6;
  sounds.lose.volume = 0.7;

  function playBrushSound() {
    const s = brushSounds[Math.floor(Math.random() * brushSounds.length)];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playBgmSound() {
    const s = bgmSounds[Math.floor(Math.random() * bgmSounds.length)];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playSound(name) {
    const s = sounds[name];
    if (!s) return;
    try {
      s.currentTime = 0;
      const p = s.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  // ====== 背景音效调度 ======
  let bgmTimer = null;
  function scheduleBgm() {
    clearTimeout(bgmTimer);
    const delay = rand(CONFIG.bgmMin, CONFIG.bgmMax);
    bgmTimer = setTimeout(() => {
      if (state.catState === 'dead') return;
      playBgmSound();
      scheduleBgm();
    }, delay);
  }

  // ====== 图片像素级判定 ======
  const hitCanvas = document.createElement('canvas');
  const hitCtx = hitCanvas.getContext('2d', { willReadFrequently: true });
  let hitData = null;
  let hitImgW = 0, hitImgH = 0;

  function buildHitMap() {
    try {
      hitImgW = catEl.naturalWidth;
      hitImgH = catEl.naturalHeight;
      if (!hitImgW || !hitImgH) return;
      hitCanvas.width  = hitImgW;
      hitCanvas.height = hitImgH;
      hitCtx.clearRect(0, 0, hitImgW, hitImgH);
      hitCtx.drawImage(catEl, 0, 0);
      hitData = hitCtx.getImageData(0, 0, hitImgW, hitImgH);
    } catch (e) {
      hitData = null;
    }
  }

  function isOnCat(clientX, clientY) {
    const imgRect = catEl.getBoundingClientRect();

    if (clientX < imgRect.left || clientX > imgRect.right ||
        clientY < imgRect.top  || clientY > imgRect.bottom) {
      return false;
    }

    if (!hitData) return true;

    const u = (clientX - imgRect.left) / imgRect.width;
    const v = (clientY - imgRect.top)  / imgRect.height;
    const px = Math.floor(u * hitImgW);
    const py = Math.floor(v * hitImgH);

    if (px < 0 || py < 0 || px >= hitImgW || py >= hitImgH) return false;

    const idx = (py * hitImgW + px) * 4;
    const alpha = hitData.data[idx + 3];
    return alpha > 20;
  }

  if (catEl.complete && catEl.naturalWidth) {
    buildHitMap();
  } else {
    catEl.addEventListener('load', buildHitMap);
  }
  catEl.addEventListener('load', buildHitMap);

  // ====== 状态 ======
  const state = {
    score: 0,
    strokeStartY: null,
    strokeStartX: null,
    lastMoveTime: 0,
    lastBrushSoundTime: 0,
    catState: 'calm',           // 'calm' | 'angry' | 'dead'

    // 划动计数（关键）
    strokesInCalm: 0,           // 平静期已累计的有效划动
    strokesInAngry: 0,          // 生气期已累计的有效划动
    calmTarget: 0,              // 平静期需要多少划动才回头
    angryTarget: 0,             // 生气期需要多少划动才死亡

    forgiveTimer: null,
    lastStrokeTime: 0,

    lastPointerX: null,
    lastPointerY: null,
    brushShown: false
  };

  // ====== 工具 ======
  const rand = (a, b) => a + Math.random() * (b - a);
  const now  = () => performance.now();

  function spawnFx(x, y, char) {
    const el = document.createElement('div');
    el.className = 'fx';
    el.textContent = char;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    gameEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ====== 猫咪状态机 ======
  function setCatState(next) {
    state.catState = next;

    if (next === 'calm') {
      catEl.src = IMG_NORMAL;
      // 重新抽一个"回头所需的划动次数"
      state.strokesInCalm = 0;
      state.calmTarget = Math.round(rand(CONFIG.calmStrokesMin, CONFIG.calmStrokesMax));
    } else if (next === 'angry') {
      catEl.src = IMG_ANGRY;
      playSound('meow');
      // 重新抽一个"死亡所需的划动次数"
      state.strokesInAngry = 0;
      state.angryTarget = Math.round(rand(CONFIG.angryStrokesMin, CONFIG.angryStrokesMax));
      // 如果玩家停手，安排"原谅"
      scheduleForgive();
    }
  }

  function scheduleForgive() {
    if (state.catState !== 'angry') return;
    clearTimeout(state.forgiveTimer);
    const delay = rand(CONFIG.forgiveMin, CONFIG.forgiveMax);
    state.forgiveTimer = setTimeout(() => {
      if (state.catState !== 'angry') return;
      if (now() - state.lastStrokeTime < delay) return;
      setCatState('calm');
    }, delay);
  }

  function die() {
    if (state.catState === 'dead') return;
    state.catState = 'dead';
    clearTimeout(state.forgiveTimer);
    playSound('lose');
    deathModal.classList.add('show');
  }

  // ====== 滑动处理 ======
  function onPointerMove(clientX, clientY) {
    if (!state.brushShown) {
      brushEl.style.display = 'block';
      state.brushShown = true;
    }

    const rect = gameEl.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    brushEl.style.left = x + 'px';
    brushEl.style.top  = y + 'px';

    if (state.catState === 'dead') return;

    const t = now();

    if (state.strokeStartY === null || t - state.lastMoveTime > CONFIG.strokeIdleReset) {
      state.strokeStartX = x;
      state.strokeStartY = y;
      state.lastMoveTime = t;
      state.lastPointerX = x;
      state.lastPointerY = y;
      return;
    }

    // 像素级判定：必须在猫的实体上
    if (!isOnCat(clientX, clientY)) {
      state.lastMoveTime = t;
      state.lastPointerX = x;
      state.lastPointerY = y;
      return;
    }

    const dy = y - state.strokeStartY;
    const dx = x - state.strokeStartX;
    const dist = Math.hypot(dx, dy);

    const threshold = state.catState === 'angry'
      ? CONFIG.minStrokeLength * 0.5
      : CONFIG.minStrokeLength;

    if (dy > 0 && dist >= threshold) {
      // ====== 一次有效梳毛 ======
      state.score++;
      scoreEl.textContent = state.score;

      if (t - state.lastBrushSoundTime > CONFIG.brushSoundCooldown) {
        playBrushSound();        // 随机 brush1 / brush2
        state.lastBrushSoundTime = t;
      }

      const fxChar = state.catState === 'angry' ? '💢' : '💗';
      spawnFx(x, y, fxChar);

      state.lastStrokeTime = t;

      // ---- 核心逻辑：用划动次数推进状态 ----
      if (state.catState === 'calm') {
        state.strokesInCalm++;
        if (state.strokesInCalm >= state.calmTarget) {
          setCatState('angry');         // 累计够了 → 回头
        }
      } else if (state.catState === 'angry') {
        state.strokesInAngry++;
        // 取消/重排"原谅"计时
        scheduleForgive();
        if (state.strokesInAngry >= state.angryTarget) {
          die();                        // 累计够了 → 死亡
        }
      }

      state.strokeStartX = x;
      state.strokeStartY = y;
    }

    state.lastMoveTime = t;
    state.lastPointerX = x;
    state.lastPointerY = y;
  }

  function onPointerLeave() {
    state.strokeStartY = null;
    state.strokeStartX = null;
  }

  // ====== 事件绑定 ======
  gameEl.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
  gameEl.addEventListener('mouseleave', onPointerLeave);

  gameEl.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    state.strokeStartY = null;
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  gameEl.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  gameEl.addEventListener('touchend', onPointerLeave);

  restartBtn.addEventListener('click', () => {
    deathModal.classList.remove('show');
    resetGame();
  });

  // ====== 重置 ======
  function resetGame() {
    state.score = 0;
    scoreEl.textContent = '0';
    state.strokeStartY = null;
    state.strokeStartX = null;
    state.lastMoveTime = 0;
    state.lastBrushSoundTime = 0;
    state.lastStrokeTime = 0;
    state.brushShown = false;
    brushEl.style.display = 'none';
    clearTimeout(state.forgiveTimer);
    setCatState('calm');
  }

  // ====== 启动 ======
  setCatState('calm');
  scheduleBgm();
})();
</script>
</body>
</html>
